<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3158"><title>Tomi BMA Field Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#17324d}button,select{font:inherit}header{position:sticky;top:0;z-index:10;background:#0b3158;color:#fff;padding:14px 16px}h1{font-size:22px;margin:0}.sub{opacity:.82;font-size:12px}.tabs,.toolbar{background:#fff;display:flex;gap:8px;overflow:auto;padding:9px 10px;border-bottom:1px solid #d8e2ea}.tabs{position:sticky;top:65px;z-index:9}.toolbar{position:sticky;top:119px;z-index:8}.tabs button,.toolbar button,.toolbar select{min-height:44px;border:1px solid #d8e2ea;border-radius:12px;background:#fff;padding:0 12px;font-weight:800;white-space:nowrap}.tabs button.on,.toolbar button.on{background:#0b3158;color:#fff}.wrap{padding:10px;max-width:1050px;margin:auto}.status{background:#fff;border:1px solid #d8e2ea;border-radius:14px;padding:12px;margin-bottom:10px}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:14px;text-align:left;min-height:105px}.addr{font-size:30px;font-weight:900}.meta{font-size:12px;color:#6c7d8c;margin-top:4px}.state{margin-top:8px;font-weight:900}.ok{color:#18794e}.bad{color:#b42318}.part{color:#a15c00}.planbox{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:10px;overflow:auto}.planhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px 10px}.planhead b{font-size:18px}.legend{font-size:11px;color:#6c7d8c}.plan{min-width:760px;width:100%;height:auto;display:block;background:#fbfcfe;border-radius:12px}.wall{fill:#fff;stroke:#5c6b78;stroke-width:4}.roomtxt{font-size:18px;font-weight:800;fill:#35495e}.roomsub{font-size:12px;fill:#718096}.det circle{stroke:#17324d;stroke-width:3;fill:#e8edf3}.det text{font-size:16px;font-weight:900;fill:#10283d;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.det.open circle{fill:#edf1f5}.det.part circle{fill:#fff0d8;stroke:#a15c00}.det.ok circle{fill:#daf3e6;stroke:#18794e}.det.bad circle{fill:#fde0dd;stroke:#b42318}.det{cursor:pointer}.bmz-list{display:grid;gap:10px}.bmz-row{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:12px;display:grid;grid-template-columns:minmax(150px,1fr) 110px 110px;gap:8px;align-items:center}.bmz-title{font-size:21px;font-weight:900}.bmz-row button{height:52px;border:1px solid #d8e2ea;border-radius:14px;background:#fff;font-weight:900}.bmz-row button.io.sel{background:#e8f7ef;border-color:#18794e;color:#18794e}.bmz-row button.nio.sel{background:#feeceb;border-color:#b42318;color:#b42318}.empty{background:#fff;border:1px dashed #b7c4cf;border-radius:16px;padding:22px;text-align:center;color:#6c7d8c}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:30;align-items:flex-end}.overlay.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}.sheet h2{font-size:32px;margin:0 0 4px}.q{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.q button{height:54px;border:1px solid #d8e2ea;border-radius:14px;background:#fff;font-size:16px;font-weight:900}.q button.io.sel{background:#e8f7ef;border-color:#18794e;color:#18794e}.q button.nio.sel{background:#feeceb;border-color:#b42318;color:#b42318}.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.foot button{height:56px;border:0;border-radius:14px;font-weight:900;font-size:17px}.next{background:#0b3158;color:#fff}.bird{display:none;position:fixed;right:14px;bottom:18px;z-index:15;font-size:58px;animation:bob 1.8s ease-in-out infinite}.bird.show{display:block}.bubble{display:none;position:fixed;right:88px;bottom:92px;z-index:16;max-width:240px;background:#fff;border:1px solid #d8e2ea;border-radius:14px;padding:10px;font-weight:800}.bubble.show{display:block}@keyframes bob{50%{transform:translateY(-6px)}}@media(max-width:700px){.cards{grid-template-columns:1fr}.q{grid-template-columns:1fr 76px 76px}.tabs{top:65px}.toolbar{top:119px}.bmz-row{grid-template-columns:1fr 76px 76px}.planbox{margin-left:-10px;margin-right:-10px;border-radius:0;border-left:0;border-right:0}}</style></head><body><header><h1>Tomi BMA Field</h1><div class="sub">Bietigheim · DEMO · jede Änderung lokal gespeichert</div></header><div class="tabs"><button id="tabPlan" class="on">🗺 Laufkarte</button><button id="tabList">☷ Liste</button><button id="tabBmz">🔥 BMZ-Kontrolle</button></div><div class="toolbar"><select id="cat"><option>Alle</option><option>Rauchmelder</option><option>HM</option><option>RAS</option><option>Koppler</option><option>Netzteil</option></select><button id="openBtn">Offen</button><button id="badBtn">n.i.O.</button><button id="voiceBtn">🔊 Vorlesen</button><button id="birdBtn">🦜 Koko & Eli</button></div><main class="wrap"><div class="status"><b id="progress">0 / 0 bearbeitet</b><div id="saveLine" style="font-size:12px;margin-top:4px">✓ Jede Änderung wird sofort lokal gespeichert</div></div><section id="planView" class="view on"><div class="planbox"><div class="planhead"><b>Demo-Laufkarte · 2.OG</b><span class="legend">○ offen · ◐ teilweise · ✓ i.O. · ! n.i.O.</span></div><svg class="plan" viewBox="0 0 1000 620" role="img" aria-label="Demo Laufkarte Bietigheim"><rect x="28" y="28" width="944" height="564" rx="8" fill="#f9fbfd" stroke="#9aabb9" stroke-width="3"/><rect class="wall" x="55" y="60" width="250" height="205"/><text class="roomtxt" x="75" y="92">2.21</text><text class="roomsub" x="75" y="112">Klassenraum</text><rect class="wall" x="305" y="60" width="310" height="205"/><text class="roomtxt" x="325" y="92">2.21.1</text><text class="roomsub" x="325" y="112">Nebenraum</text><rect class="wall" x="615" y="60" width="330" height="205"/><text class="roomtxt" x="635" y="92">2.20</text><text class="roomsub" x="635" y="112">Klassenraum</text><rect class="wall" x="55" y="265" width="890" height="120"/><text class="roomtxt" x="75" y="300">2.07 Flur</text><rect class="wall" x="55" y="385" width="430" height="170"/><text class="roomtxt" x="75" y="420">2.14</text><text class="roomsub" x="75" y="440">Raum</text><rect class="wall" x="485" y="385" width="460" height="170"/><text class="roomtxt" x="505" y="420">2.16</text><text class="roomsub" x="505" y="440">Raum</text><g id="svgDevices"></g></svg></div></section><section id="listView" class="view"><div id="cards" class="cards"></div></section><section id="bmzView" class="view"><div class="status"><b id="bmzProgress">0 / 0 BMZ bestätigt</b><div style="font-size:12px;margin-top:4px">Nach dem Meldertest: bestätigen, ob der Alarm an der BMZ angezeigt wurde.</div></div><div id="bmzList" class="bmz-list"></div></section></main><div id="overlay" class="overlay"><div class="sheet"><h2 id="title"></h2><div id="subtitle" class="meta"></div><div id="questions"></div><div class="foot"><button id="closeBtn">Schließen</button><button id="nextBtn" class="next">Nächster →</button></div></div></div><div id="bird" class="bird">🦜🦜</div><div id="bubble" class="bubble"></div><script>const DEV=[['Rauchmelder','58/1','L01','2.OG 2.21.1',440,150],['Rauchmelder','58/2','L01','2.OG 2.21',180,170],['Rauchmelder','59/1','L01','2.OG 2.20',790,165],['Rauchmelder','55/3','L02','2.OG 2.14',260,470],['HM','4/4','L02','2.OG Flur',540,325],['RAS','8/1','L08','UG -1.11 Lager',0,0],['Koppler','K100','L08','EG Technik',0,0],['Netzteil','NT-01','Sonder','EG BMZ',0,0]].map(x=>({cat:x[0],a:x[1],loop:x[2],room:x[3],x:x[4],y:x[5]}));const Q={Rauchmelder:['Sichtprüfung','Prüfgas','Beschriftung'],HM:['Sichtprüfung','Handauslösung','Beschriftung'],RAS:['Sichtprüfung','Ansaugung / Rohrsystem','Störung','Reset'],Koppler:['Sichtprüfung','Ansteuerung','Rückmeldung'],Netzteil:['Sichtprüfung','Netz 230 V','Ausgang 24 V','Akku','Störung']};const $=s=>document.querySelector(s);let db=JSON.parse(localStorage.getItem('tomi_bma_demo_v4')||'{}'),bmz=JSON.parse(localStorage.getItem('tomi_bma_bmz_demo_v1')||'{}'),cur=null,filter='all',voice=localStorage.getItem('tomi_bma_voice')==='1',birds=localStorage.getItem('tomi_bma_birds')==='1',view='plan';const key=d=>d.cat+'|'+d.a;function st(d){const r=db[key(d)];if(!r)return'open';const vals=Object.entries(r).filter(([k])=>!k.startsWith('_')).map(([,v])=>v);if(!vals.length)return'open';if(vals.includes('nio'))return'bad';const qs=Q[d.cat]||[];if(qs.length&&qs.every(q=>r[q]==='io'))return'ok';return'part'}function tested(d){return st(d)!=='open'}function visible(){const c=$('#cat').value;return DEV.filter(d=>c==='Alle'||d.cat===c).filter(d=>filter==='all'||filter==='open'&&st(d)==='open'||filter==='bad'&&st(d)==='bad')}function render(){const c=$('#cat').value,all=DEV.filter(d=>c==='Alle'||d.cat===c),done=all.filter(tested).length;$('#progress').textContent=done+' / '+all.length+' bearbeitet';$('#cards').innerHTML=visible().map(d=>{const s=st(d),t=s==='ok'?'✓ i.O.':s==='bad'?'! n.i.O.':s==='part'?'◐ teilweise':'○ offen';return `<button class="card" data-k="${key(d)}"><div class="addr">${d.a}</div><div class="meta">${d.cat} · ${d.loop} · ${d.room}</div><div class="state ${s}">${t}</div></button>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openDevice(DEV.find(d=>key(d)===b.dataset.k),true));renderPlan();renderBmz()}function renderPlan(){const onPlan=DEV.filter(d=>d.x>0&&d.y>0).filter(d=>$('#cat').value==='Alle'||d.cat===$('#cat').value);$('#svgDevices').innerHTML=onPlan.map(d=>{const s=st(d);return `<g class="det ${s}" data-k="${key(d)}" transform="translate(${d.x} ${d.y})"><circle r="31"></circle><text y="1">${d.a}</text></g>`}).join('');document.querySelectorAll('.det').forEach(g=>g.onclick=()=>openDevice(DEV.find(d=>key(d)===g.dataset.k),true))}function openDevice(d,readAloud=false){cur=d;$('#title').textContent=d.a;$('#subtitle').textContent=d.cat+' · '+d.loop+' · '+d.room;const r=db[key(d)]||{};$('#questions').innerHTML=(Q[d.cat]||[]).map(q=>`<div class="q"><b>${q}</b><button class="io ${r[q]==='io'?'sel':''}" data-q="${q}" data-v="io">i.O.</button><button class="nio ${r[q]==='nio'?'sel':''}" data-q="${q}" data-v="nio">n.i.O.</button></div>`).join('');document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>answer(b.dataset.q,b.dataset.v));$('#overlay').classList.add('show');if(voice&&readAloud)speak(d)}function answer(q,v){const k=key(cur);db[k]=db[k]||{};db[k][q]=v;db[k]._last=new Date().toISOString();localStorage.setItem('tomi_bma_demo_v4',JSON.stringify(db));openDevice(cur,false);render();if(v==='nio'&&birds)quip('Eli: n.i.O.? Koko sagt, prüf das lieber noch einmal. 😄')}function next(){const arr=DEV.filter(d=>$('#cat').value==='Alle'||d.cat===$('#cat').value);openDevice(arr[(arr.indexOf(cur)+1)%arr.length],false)}function speak(d){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Melder '+d.a.replace('/',' Strich '));u.lang='de-DE';speechSynthesis.speak(u)}function renderBmz(){const arr=DEV.filter(tested);const done=arr.filter(d=>bmz[key(d)]==='io'||bmz[key(d)]==='nio').length;$('#bmzProgress').textContent=done+' / '+arr.length+' BMZ bestätigt';if(!arr.length){$('#bmzList').innerHTML='<div class="empty">Noch keine Melder geprüft. Erst einen Melder auf der Laufkarte oder in der Liste bearbeiten.</div>';return}$('#bmzList').innerHTML=arr.map(d=>{const v=bmz[key(d)]||'';return `<div class="bmz-row"><div><div class="bmz-title">${d.a}</div><div class="meta">${d.cat} · ${d.loop} · ${d.room}<br>Alarm an BMZ angezeigt?</div></div><button class="io ${v==='io'?'sel':''}" data-k="${key(d)}" data-v="io">i.O.</button><button class="nio ${v==='nio'?'sel':''}" data-k="${key(d)}" data-v="nio">n.i.O.</button></div>`}).join('');document.querySelectorAll('.bmz-row button').forEach(b=>b.onclick=()=>{bmz[b.dataset.k]=b.dataset.v;localStorage.setItem('tomi_bma_bmz_demo_v1',JSON.stringify(bmz));renderBmz()})}function setView(v){view=v;['plan','list','bmz'].forEach(x=>$('#'+x+'View').classList.toggle('on',x===v));$('#tabPlan').classList.toggle('on',v==='plan');$('#tabList').classList.toggle('on',v==='list');$('#tabBmz').classList.toggle('on',v==='bmz')}function quip(t){$('#bird').classList.add('show');$('#bubble').textContent=t;$('#bubble').classList.add('show');setTimeout(()=>$('#bubble').classList.remove('show'),4500)}$('#tabPlan').onclick=()=>setView('plan');$('#tabList').onclick=()=>setView('list');$('#tabBmz').onclick=()=>setView('bmz');$('#cat').onchange=render;$('#openBtn').onclick=()=>{filter=filter==='open'?'all':'open';render()};$('#badBtn').onclick=()=>{filter=filter==='bad'?'all':'bad';render()};$('#voiceBtn').onclick=()=>{voice=!voice;localStorage.setItem('tomi_bma_voice',voice?'1':'0');$('#voiceBtn').classList.toggle('on',voice)};$('#birdBtn').onclick=()=>{birds=!birds;localStorage.setItem('tomi_bma_birds',birds?'1':'0');$('#birdBtn').classList.toggle('on',birds);$('#bird').classList.toggle('show',birds);if(birds)quip('Koko & Eli: Wenn du zu langsam bist, schreiben wir deinem Chef natürlich nicht wirklich. 😄')};$('#closeBtn').onclick=()=>$('#overlay').classList.remove('show');$('#nextBtn').onclick=next;$('#voiceBtn').classList.toggle('on',voice);$('#birdBtn').classList.toggle('on',birds);$('#bird').classList.toggle('show',birds);render();</script></body></html>

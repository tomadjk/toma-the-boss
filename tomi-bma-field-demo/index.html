<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3158"><title>Tomi BMA Field Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#17324d}header{position:sticky;top:0;z-index:5;background:#0b3158;color:#fff;padding:14px 16px}h1{font-size:22px;margin:0}.sub{opacity:.8;font-size:12px}.toolbar{position:sticky;top:66px;z-index:4;background:#fff;padding:10px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #d8e2ea}.toolbar button,.toolbar select{min-height:44px;border:1px solid #d8e2ea;border-radius:12px;background:#fff;padding:0 12px;font-weight:800;white-space:nowrap}.toolbar .on{background:#0b3158;color:#fff}.wrap{padding:10px;max-width:1000px;margin:auto}.status{background:#fff;border:1px solid #d8e2ea;border-radius:14px;padding:12px;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid #d8e2ea;border-radius:16px;padding:14px;text-align:left;min-height:105px}.addr{font-size:30px;font-weight:900}.meta{font-size:12px;color:#6c7d8c;margin-top:4px}.state{margin-top:8px;font-weight:900}.ok{color:#18794e}.bad{color:#b42318}.part{color:#a15c00}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.overlay.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}.sheet h2{font-size:32px;margin:0 0 4px}.q{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.q button{height:54px;border:1px solid #d8e2ea;border-radius:14px;background:#fff;font-size:16px;font-weight:900}.q button.io.sel{background:#e8f7ef;border-color:#18794e;color:#18794e}.q button.nio.sel{background:#feeceb;border-color:#b42318;color:#b42318}.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.foot button{height:56px;border:0;border-radius:14px;font-weight:900;font-size:17px}.next{background:#0b3158;color:#fff}.bird{display:none;position:fixed;right:14px;bottom:18px;z-index:15;font-size:58px;animation:bob 1.8s ease-in-out infinite}.bird.show{display:block}.bubble{display:none;position:fixed;right:88px;bottom:92px;z-index:16;max-width:240px;background:#fff;border:1px solid #d8e2ea;border-radius:14px;padding:10px;font-weight:800}.bubble.show{display:block}@keyframes bob{50%{transform:translateY(-6px)}}@media(max-width:700px){.cards{grid-template-columns:1fr}.q{grid-template-columns:1fr 78px 78px}.toolbar{top:65px}}</style></head><body><header><h1>Tomi BMA Field</h1><div class="sub">Bietigheim · DEMO · lokal gespeichert</div></header><div class="toolbar"><select id="cat"><option>Alle</option><option>Rauchmelder</option><option>HM</option><option>RAS</option><option>Koppler</option><option>Netzteil</option></select><button id="openBtn">Offen</button><button id="badBtn">n.i.O.</button><button id="voiceBtn">🔊 Vorlesen</button><button id="birdBtn">🦜 Koko & Eli</button></div><main class="wrap"><div class="status"><b id="progress">0 / 0 bearbeitet</b><div style="font-size:12px;margin-top:4px">✓ Jede Änderung wird sofort lokal gespeichert</div></div><div id="cards" class="cards"></div></main><div id="overlay" class="overlay"><div class="sheet"><h2 id="title"></h2><div id="subtitle" class="meta"></div><div id="questions"></div><div class="foot"><button id="closeBtn">Schließen</button><button id="nextBtn" class="next">Nächster →</button></div></div></div><div id="bird" class="bird">🦜🦜</div><div id="bubble" class="bubble"></div><script>const DEV=[['Rauchmelder','58/1','L01','2.OG'],['Rauchmelder','58/2','L01','2.OG'],['Rauchmelder','59/1','L01','2.OG'],['Rauchmelder','55/3','L02','2.OG'],['HM','4/4','L02','2.OG'],['RAS','8/1','L08','UG'],['Koppler','K100','L08','EG'],['Netzteil','NT-01','Sonder','BMZ']].map(x=>({cat:x[0],a:x[1],loop:x[2],room:x[3]}));const Q={Rauchmelder:['Sichtprüfung','Prüfgas','Alarm an BMZ','Klartext an BMZ','Beschriftung'],HM:['Sichtprüfung','Handauslösung','Alarm an BMZ','Klartext an BMZ','Beschriftung'],RAS:['Sichtprüfung','Ansaugung / Rohrsystem','Alarm an BMZ','Störung an BMZ','Reset'],Koppler:['Sichtprüfung','Ansteuerung','Rückmeldung','Klartext an BMZ'],Netzteil:['Sichtprüfung','Netz 230 V','Ausgang 24 V','Akku','Störung an BMZ']};const $=s=>document.querySelector(s);let db=JSON.parse(localStorage.getItem('tomi_bma_demo_v3')||'{}'),cur=null,filter='all',voice=localStorage.getItem('tomi_bma_voice')==='1',birds=localStorage.getItem('tomi_bma_birds')==='1';const key=d=>d.cat+'|'+d.a;function st(d){const r=db[key(d)];if(!r)return'open';const vals=Object.values(r);if(vals.includes('nio'))return'bad';const qs=Q[d.cat]||[];if(qs.length&&qs.every(q=>r[q]==='io'))return'ok';return'part'}function visible(){const c=$('#cat').value;return DEV.filter(d=>c==='Alle'||d.cat===c).filter(d=>filter==='all'||filter==='open'&&st(d)==='open'||filter==='bad'&&st(d)==='bad')}function render(){const c=$('#cat').value,all=DEV.filter(d=>c==='Alle'||d.cat===c),done=all.filter(d=>st(d)!=='open').length;$('#progress').textContent=done+' / '+all.length+' bearbeitet';$('#cards').innerHTML=visible().map(d=>{const s=st(d),t=s==='ok'?'✓ i.O.':s==='bad'?'! n.i.O.':s==='part'?'◐ teilweise':'○ offen';return `<button class="card" data-k="${key(d)}"><div class="addr">${d.a}</div><div class="meta">${d.cat} · ${d.loop} · ${d.room}</div><div class="state ${s}">${t}</div></button>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openDevice(DEV.find(d=>key(d)===b.dataset.k),true))}function openDevice(d,readAloud=false){cur=d;$('#title').textContent=d.a;$('#subtitle').textContent=d.cat+' · '+d.loop+' · '+d.room;const r=db[key(d)]||{};$('#questions').innerHTML=(Q[d.cat]||[]).map(q=>`<div class="q"><b>${q}</b><button class="io ${r[q]==='io'?'sel':''}" data-q="${q}" data-v="io">i.O.</button><button class="nio ${r[q]==='nio'?'sel':''}" data-q="${q}" data-v="nio">n.i.O.</button></div>`).join('');document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>answer(b.dataset.q,b.dataset.v));$('#overlay').classList.add('show');if(voice&&readAloud)speak(d)}function answer(q,v){const k=key(cur);db[k]=db[k]||{};db[k][q]=v;db[k]._last=new Date().toISOString();localStorage.setItem('tomi_bma_demo_v3',JSON.stringify(db));openDevice(cur,false);render();if(v==='nio'&&birds)quip('Eli: n.i.O.? Koko kaže da prvo provjeriš još jednom. 😄')}function next(){const arr=DEV.filter(d=>$('#cat').value==='Alle'||d.cat===$('#cat').value);openDevice(arr[(arr.indexOf(cur)+1)%arr.length],false)}function speak(d){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Melder '+d.a.replace('/',' Strich '));u.lang='de-DE';speechSynthesis.speak(u)}function quip(t){$('#bird').classList.add('show');$('#bubble').textContent=t;$('#bubble').classList.add('show');setTimeout(()=>$('#bubble').classList.remove('show'),4500)}$('#cat').onchange=render;$('#openBtn').onclick=()=>{filter=filter==='open'?'all':'open';render()};$('#badBtn').onclick=()=>{filter=filter==='bad'?'all':'bad';render()};$('#voiceBtn').onclick=()=>{voice=!voice;localStorage.setItem('tomi_bma_voice',voice?'1':'0');$('#voiceBtn').classList.toggle('on',voice)};$('#birdBtn').onclick=()=>{birds=!birds;localStorage.setItem('tomi_bma_birds',birds?'1':'0');$('#birdBtn').classList.toggle('on',birds);$('#bird').classList.toggle('show',birds);if(birds)quip('Koko & Eli: Ako radiš presporo, šefu nećemo stvarno ništa poslati. 😄')};$('#closeBtn').onclick=()=>$('#overlay').classList.remove('show');$('#nextBtn').onclick=next;$('#voiceBtn').classList.toggle('on',voice);$('#birdBtn').classList.toggle('on',birds);$('#bird').classList.toggle('show',birds);render();</script></body></html>

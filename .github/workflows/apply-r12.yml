name: Apply Tomi BMA Field r12
on:
  push:
    paths:
      - '.github/workflows/apply-r12.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone r12
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tomi-bma-field-demo/index.html')
          s=p.read_text()
          patch=Path('tomi-bma-field-demo/r12-patch.js').read_text()
          pre="<script>try{let m=JSON.parse(localStorage.getItem('tbmameta8')||'{}');delete m.currentHash;localStorage.setItem('tbmameta8',JSON.stringify(m))}catch(e){}</script>"
          if 'r12-patch.js standalone' not in s:
              s=s.replace('<title>Tomi BMA Field r11</title>','<title>Tomi BMA Field r12</title>')
              s=s.replace('Bietigheim · REALTEST r11 · offline-first','Bietigheim · REALTEST r12 · Montage-Planeditor')
              s=s.replace("<script>\nconst VERSION='r11';",pre+"\n<script>\nconst VERSION='r11';",1)
              s=s.replace('</body>',"<script>/* r12-patch.js standalone */\n"+patch+"\n</script>\n</body>",1)
              p.write_text(s)
          PY
      - name: Commit r12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tomi-bma-field-demo/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tomi BMA Field r12: editable montage Laufkarte and test feedback'
          git push

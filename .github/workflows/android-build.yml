name: Build Toma the Boss APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk t.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomaTheBoss-APK
          path: t.apk
          if-no-files-found: error

      - name: Create beta release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$GITHUB_SHA" --title "Toma the Boss - Beta" --notes "Automatski testni APK za Android i Fire TV."
          fi

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload beta t.apk --clobber
